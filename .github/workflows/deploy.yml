```yaml
name: Deploy Presentismo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Descargar WebApplication Targets
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $nuget = "$env:RUNNER_TEMP\nuget.exe"
          $packageDir = "$env:RUNNER_TEMP\webtargets"

          Write-Host "Descargando NuGet..."

          Invoke-WebRequest `
            -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
            -OutFile $nuget

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $packageDir `
            -Force | Out-Null

          Write-Host "Descargando MSBuild.Microsoft.VisualStudio.Web.targets..."

          & $nuget install `
            MSBuild.Microsoft.VisualStudio.Web.targets `
            -Version 14.0.0.3 `
            -OutputDirectory $packageDir `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo descargar el paquete WebApplication Targets."
          }

          Write-Host ""
          Write-Host "Paquete descargado:"
          Get-ChildItem $packageDir -Recurse -File |
            Select-Object FullName


      - name: Instalar
```
