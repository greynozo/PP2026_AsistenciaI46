name: Despliegue Automático .NET Framework a SmarterASP.NET

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente cada vez que subís cambios a main

jobs:
  build-and-deploy:
    runs-on: windows-latest  # Servidores Windows estables de GitHub

    steps:
    # 1. Descargar el código de tu repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar MSBuild
    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. Configurar NuGet
    - name: Configurar NuGet
      uses: nuget/setup-nuget@v1

    # 4. Restaurar paquetes usando el parámetro correcto en plural
    - name: Restaurar Paquetes NuGet
      run: nuget restore PresentismoWebI46.csproj -Properties VisualStudioVersion=17.0

    # 5. Compilar y publicar el proyecto mapeando la versión compatible
    - name: Compilar y Publicar Proyecto
      run: |
        msbuild PresentismoWebI46.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:PublishUrl="../publish" /p:DeleteExistingFiles=true /p:VisualStudioVersion=17.0
        
    # 6. Subir el resultado al hosting vía FTP
    - name: Subir archivos por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /siteroot/  # Carpeta pública principal de SmarterASP.NET
