name: Despliegue Automático .NET Framework a SmarterASP.NET

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente cada vez que subís cambios a main

jobs:
  build-and-deploy:
    runs-on: windows-latest  # Usamos servidores Windows nativos de GitHub

    steps:
    # 1. Descargar el código de tu repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar MSBuild (El compilador tradicional de Visual Studio)
    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. Configurar NuGet para restaurar paquetes antiguos si los usa
    - name: Configurar NuGet
      uses: nuget/setup-nuget@v1

    # 4. Restaurar paquetes NuGet del proyecto saltándose restricciones rígidas de MSBuild
    - name: Restaurar Paquetes NuGet
      run: nuget restore PresentismoWebI46.csproj -MSBuildPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin"

    # 5. Compilar y publicar el proyecto remapeando la ruta de WebApplication.targets al entorno moderno
    - name: Compilar y Publicar Proyecto
      run: |
        msbuild PresentismoWebI46.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:PublishUrl="../publish" /p:DeleteExistingFiles=true /p:VisualStudioVersion=17.0 /p:MSBuildExtensionsPath32="C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild"
    # 6. Subir el resultado al hosting vía FTP
    - name: Subir archivos por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /siteroot/  # Carpeta pública principal de SmarterASP.NET
