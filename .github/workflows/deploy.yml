name: Despliegue Automático .NET Framework a SmarterASP.NET

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente cada vez que subís cambios a main

jobs:
  build-and-deploy:
    runs-on: windows-latest  # Servidores Windows estables de GitHub

    steps:
    # 1. Descargar el código de tu repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar MSBuild
    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. Restaurar los paquetes NuGet de forma aislada
    - name: Restaurar Paquetes
      run: msbuild PresentismoWebI46.csproj /t:Restore /p:MSBuildExtensionsPath32="C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild" /p:VisualStudioVersion=17.0

    # 4. COMPILACIÓN DEFINITIVA: Inyectamos la extensión web moderna en la variable que el .csproj usa para buscar
    - name: Compilar y Publicar Proyecto
      run: |
        msbuild PresentismoWebI46.csproj /t:Build /p:Configuration=Release /p:OutDir=../publish/ /p:VisualStudioVersion=17.0 /p:MSBuildExtensionsPath32="C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild"
        
    # 5. Subir el resultado al hosting vía FTP
    - name: Subir archivos por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /siteroot/  # Carpeta pública principal de SmarterASP.NET
