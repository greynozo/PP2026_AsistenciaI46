name: Deploy Presentismo

on:
push:
branches:
- main

jobs:
build:
runs-on: windows-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Configurar MSBuild
    uses: microsoft/setup-msbuild@v2

  - name: Verificar MSBuild
    shell: powershell
    run: |
      msbuild -version

  - name: Verificar proyecto
    shell: powershell
    run: |
      if (-not (Test-Path "PresentismoWebI46.csproj")) {
        throw "No se encontró PresentismoWebI46.csproj"
      }

      Write-Host "Proyecto encontrado correctamente."

  - name: Compilar proyecto
    shell: powershell
    run: |
      msbuild PresentismoWebI46.csproj /t:Build /p:Configuration=Release /p:Platform="Any CPU"
```
