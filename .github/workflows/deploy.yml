name: Despliegue Automático .NET Framework a SmarterASP.NET

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente cada vez que subís cambios a main

jobs:
  build-and-deploy:
    runs-on: windows-latest  # Servidores Windows estables de GitHub

    steps:
    # 1. Descargar el código de tu repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar MSBuild
    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    # 3. EL TRUCO DEFINITIVO: Reemplazar la ruta fija v10.0 por la ruta moderna compatible de forma automática
    - name: Corregir compatibilidad del .csproj
      run: |
        (Get-Content PresentismoWebI46.csproj) -replace '\\v10.0\\WebApplications\\Microsoft.WebApplication.targets', '$(VSToolsPath)\WebApplications\Microsoft.WebApplication.targets' | Set-Content PresentismoWebI46.csproj
      shell: powershell

    # 4. Restaurar los paquetes NuGet de forma limpia
    - name: Restaurar Paquetes
      run: msbuild PresentismoWebI46.csproj /t:Restore

    # 5. Compilar y Publicar usando la estructura estándar y moderna de Visual Studio
    - name: Compilar y Publicar Proyecto
      run: |
        msbuild PresentismoWebI46.csproj /t:Build /p:Configuration=Release /p:OutDir=../publish/
        
    # 6. Subir el resultado al hosting vía FTP
    - name: Subir archivos por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /siteroot/  # Carpeta pública principal de SmarterASP.NET
